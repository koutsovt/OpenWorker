name: skills.propose
description: Propose a new skill or an improvement to an existing one. The proposal is recorded for human review and changes nothing by itself.
owner: platform
action: write
risk: low
dataClassification: internal
limits:
  maxCallsPerSession: 2
inputSchema:
  type: object
  properties:
    skill_id: { type: string, description: Existing skill id, or a suggested id for a new skill. }
    title: { type: string }
    rationale: { type: string, description: Why the change is needed, with the evidence that prompted it. }
    proposed_text: { type: string, description: The proposed method text. }
  required: [skill_id, title, rationale, proposed_text]
  additionalProperties: false
