# Runtime model providers. Keys are read from the named environment variables;
# never put a key in this file.
providers:
  # Claude through Claude Code on a personal subscription. Local, individual use only:
  # it takes no key here and must not be used in a hosted deployment.
  - name: Claude
    api: claude-code
  - name: OpenAI
    api: responses
    apiKeyEnv: OPENAI_API_KEY
  - name: DeepSeek
    api: chat-completions
    # Verify against DeepSeek's current API documentation before first use.
    baseUrl: https://api.deepseek.com/v1
    apiKeyEnv: DEEPSEEK_API_KEY
