# Runtime model providers. Keys are read from the named environment variables;
# never put a key in this file. Claude is not listed here: it runs locally
# through the Claude Code adapter on a personal subscription.
providers:
  - name: OpenAI
    api: responses
    apiKeyEnv: OPENAI_API_KEY
  - name: DeepSeek
    api: chat-completions
    # Verify against DeepSeek's current API documentation before first use.
    baseUrl: https://api.deepseek.com/v1
    apiKeyEnv: DEEPSEEK_API_KEY
